[project]
name = "stitchproof"
version = "0.1.0"
description = "A local tech editor for crochet patterns: a fine-tuned small model translates rows, code checks the stitch counts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Heet Ranpura" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "python-dotenv",
    "rich",
    "jinja2",
    "pypdf",
    "matplotlib",
]

[project.optional-dependencies]
tinker = ["tinker", "tinker-cookbook"]
app = ["gradio"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitchproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
